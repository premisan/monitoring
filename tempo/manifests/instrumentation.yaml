apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: default-instrumentation
spec:
  # 트레이스 및 메트릭 전송 대상 엔드포인트 설정
  exporter:
    endpoint: http://tempo-distributor.monitoring.svc.cluster.local:4317

  # 공통 샘플링 비율 (1.0 = 100% 수집, 대용량 트래픽 환경에서는 0.1~0.2 권장)
  sampler:
    type: parentbased_traceidratio
    argument: "1.0"

  # Java 설정 (Spring Boot 등 - gRPC 4317 포트 사용)
  java:
    env:
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
      - name: OTEL_METRICS_EXPORTER
        value: "none" # 메트릭 미사용 시 전송 방지

  # Python 설정 (Django, FastAPI, Flask 등 - 기본 프로토콜 HTTP 4318 포트 사용)
  python:
    env:
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
      - name: OTEL_METRICS_EXPORTER
        value: "none"
      - name: OTEL_LOGS_EXPORTER
        value: "none"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://tempo-distributor.monitoring.svc.cluster.local:4318"
      # [옵션 B: Collector 경유]
      # - name: OTEL_EXPORTER_OTLP_ENDPOINT
      #   value: "http://otel-collector-collector.monitoring.svc.cluster.local:4318"

  # Node.js 설정 (Express, NestJS 등 - HTTP 4318 포트 사용)
  nodejs:
    env:
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
      # [옵션 A: 직접 전송] 단일: tempo-dev:4318 / 분산: tempo-distributor:4318
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://tempo-dev.monitoring.svc.cluster.local:4318"
      # [옵션 B: Collector 경유]
      # - name: OTEL_EXPORTER_OTLP_ENDPOINT
      #   value: "http://otel-collector-collector.monitoring.svc.cluster.local:4318"

  # Go 설정 (Go 애플리케이션 eBPF 기반 계측)
  go:
    env:
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"

  # .NET 설정
  dotnet:
    env:
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
