apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: tempo-gateway
  namespace: monitoring
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 4317
        name: grpc-otlp
        protocol: GRPC
      hosts:
        - "tempo.example.com"
    - port:
        number: 4318
        name: http-otlp
        protocol: HTTP
      hosts:
        - "tempo.example.com"
    - port:
        number: 3200
        name: http-query
        protocol: HTTP
      hosts:
        - "tempo.example.com"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: tempo-vs
  namespace: monitoring
spec:
  hosts:
    - "tempo.example.com"
  gateways:
    - tempo-gateway
  http:
    - match:
        - port: 4317
      route:
        - destination:
            host: tempo-distributor.monitoring.svc.cluster.local
            port:
              number: 4317
    - match:
        - port: 4318
      route:
        - destination:
            host: tempo-distributor.monitoring.svc.cluster.local
            port:
              number: 4318
    - match:
        - port: 3200
      route:
        - destination:
            host: tempo-query-frontend.monitoring.svc.cluster.local
            port:
              number: 3200
