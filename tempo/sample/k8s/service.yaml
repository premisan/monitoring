apiVersion: v1
kind: Service
metadata:
  name: flask-hello-world-service
  namespace: sample
  labels:
    app: flask-hello-world
spec:
  # 클러스터 내부 통신용 기본값: ClusterIP
  # 외부 노출이 필요한 경우 NodePort 또는 LoadBalancer로 변경할 수 있습니다.
  type: ClusterIP
  selector:
    app: flask-hello-world
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5000
