serviceAccount:
  create: true
  name: "tempo-distributed"
  annotations:
    # GKE Workload Identity 연동 주석
    iam.gke.io/gcp-service-account: "tempo-gcs-sa@<GCP_프로젝트_ID>.iam.gserviceaccount.com"

tempo:
  structuredConfig:
    multitenancy_enabled: false

    # 1. Distributor: OTLP 수신 포트 오픈
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    # 2. Ingester: 수백 스팬 환경에 맞춘 플러시 블록 튜닝
    ingester:
      max_block_duration: 1h        # 트래픽이 적으므로 최대 1시간 단위 보관
      max_block_bytes: 268435456    # 256MB 도달 시 GCS로 플러시
      complete_block_timeout: 30m
      trace_idle_period: 10s

    # 3. Compactor: 데이터 보존 기간 설정
    compactor:
      compaction:
        block_retention: 72h

    # 4. 스토리지 백엔드: GCS 버킷 지정
    storage:
      trace:
        backend: gcs
        gcs:
          bucket_name: "<GCS_버킷_이름>"
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

# -------------------------------------------------------------
# 컴포넌트별 경량화 리소스 설정 (초당 수백 스팬 기준)
# -------------------------------------------------------------

# Distributor: 기본 1대
distributor:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Ingester: 최소 이중화(2대) 및 일반 표준 영구 디스크(10Gi) 적용
ingester:
  replicas: 2
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "standard-rwo" # 표준 영구 디스크 사용
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Compactor: 단일 파드 구성
compactor:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: "standard-rwo"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Querier: 단일 워커 구성
querier:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Query Frontend: 단일 인스턴스 구성
queryFrontend:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# 경량화 환경에서는 Memcached 비활성화
memcached:
  enabled: false
