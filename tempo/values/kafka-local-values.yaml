image:
  registry: docker.io
  repository: bitnamilegacy/kafka
  tag: 4.0.0-debian-12-r10
kraft:
  enabled: true
controller:
  replicaCount: 1
  controllerOnly: false
  extraConfig: |
    num.partitions=1
broker:
  replicaCount: 0
listeners:
  client:
    protocol: PLAINTEXT
persistence:
  size: 8Gi
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"
extraConfig: |
  num.partitions=1
extraEnvVars:
  - name: KAFKA_CFG_NUM_PARTITIONS
    value: "1"
autoCreateTopicsEnable: true
