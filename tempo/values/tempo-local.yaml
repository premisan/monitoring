# 1. Distributor Service에 OTLP gRPC(4317) 및 HTTP(4318) 포트 오픈
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

# 2. 멀티테넌시 설정
multitenancyEnabled: false

# 3. Kafka Ingest WAL 브로커 연동 (Tempo 3.0 마이크로서비스 필수)
ingest:
  kafka:
    address: "tempo-kafka.monitoring.svc.cluster.local:9092"
    topic: "tempo-traces"

# 4. 백엔드 스토리지 설정
storage:
  trace:
    backend: local

# 5. 컴포넌트별 파드 구성
distributor:
  replicas: 1

blockBuilder:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi

liveStore:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi

backendScheduler:
  enabled: true
  replicas: 1

backendWorker:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi

querier:
  replicas: 1

queryFrontend:
  replicas: 1
