# Distributor Service에 OTLP gRPC(4317) 및 HTTP(4318) 포트 생성
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

# 3.x에서는 Ingester/Compactor가 제거되고 Block-Builder/Live-Store로 대체되므로 2.x 레거시 비활성화
ingester:
  enabled: false
compactor:
  enabled: false
memcached:
  enabled: false

tempo:
  structuredConfig:
    multitenancy_enabled: false
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
    ingest:
      kafka:
        address: "tempo-kafka.monitoring.svc.cluster.local:9092"
        topic: "tempo-traces"
    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/traces

distributor:
  replicas: 1

blockBuilder:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi

liveStore:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi

backendScheduler:
  enabled: true
  replicas: 1

backendWorker:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi

querier:
  replicas: 1

queryFrontend:
  replicas: 1
