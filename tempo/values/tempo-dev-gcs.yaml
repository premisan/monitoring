serviceAccount:
  create: true
  name: "tempo"
  automountServiceAccountToken: true
  annotations:
    iam.gke.io/gcp-service-account: "tempo-gcs-sa@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

multitenancyEnabled: false

ingest:
  kafka:
    address: "tempo-kafka.monitoring.svc.cluster.local:9092"
    topic: "tempo-traces"
    auto_create_topic_enabled: true
    auto_create_topic_default_partitions: 6

storage:
  trace:
    backend: gcs
    gcs:
      bucket_name: "tempo-traces-<GCP_PROJECT_ID>"
    block:
      version: vParquet5

distributor:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

blockBuilder:
  enabled: true
  replicas: 6 # Kafka 토픽 파티션 수(6개)와 1:1 매핑
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

liveStore:
  enabled: true
  replicas: 6 # Kafka 토픽 파티션 수(6개)와 1:1 매핑 (최근 트레이스 서빙)
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard-rwo"
  resources:
    requests:
      cpu: "250m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

backendScheduler:
  enabled: true
  replicas: 1
  config:
    provider:
      compaction:
        compaction:
          block_retention: 72h # 개발 환경 3일 보존

backendWorker:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

querier:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

queryFrontend:
  replicas: 1
