serviceAccount:
  create: true
  name: "tempo"
  annotations:
    iam.gke.io/gcp-service-account: "tempo-gcs-sa@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

# 1. Distributor Service에 OTLP gRPC(4317) 및 HTTP(4318) 포트 오픈
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

# 2. 멀티테넌시 설정
multitenancyEnabled: false

# 3. Kafka Ingest WAL 브로커 연동
ingest:
  kafka:
    address: "tempo-kafka.monitoring.svc.cluster.local:9092"
    topic: "tempo-traces"

# 4. GCS 백엔드 스토리지 설정
storage:
  trace:
    backend: gcs
    gcs:
      bucket_name: "tempo-traces-<GCP_PROJECT_ID>"
    block:
      version: vParquet5

# 5. 컴포넌트별 파드 구성
distributor:
  replicas: 1

blockBuilder:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard-rwo"

liveStore:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard-rwo"

backendScheduler:
  enabled: true
  replicas: 1

backendWorker:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard-rwo"

querier:
  replicas: 1

queryFrontend:
  replicas: 1
