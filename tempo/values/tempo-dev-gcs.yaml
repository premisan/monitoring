serviceAccount:
  create: true
  name: "tempo"
  annotations:
    iam.gke.io/gcp-service-account: "tempo-gcs-sa@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

# Distributor Service에 OTLP gRPC(4317) 및 HTTP(4318) 포트 생성
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

tempo:
  structuredConfig:
    multitenancy_enabled: false
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"
    ingest:
      kafka:
        address: "tempo-kafka.monitoring.svc.cluster.local:9092"
        topic: "tempo-traces"
    storage:
      trace:
        backend: gcs
        gcs:
          bucket_name: "tempo-traces-<GCP_PROJECT_ID>"
        block:
          version: vParquet5

distributor:
  replicas: 1

blockBuilder:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard-rwo"

liveStore:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard-rwo"

backendScheduler:
  enabled: true
  replicas: 1

backendWorker:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "standard-rwo"

querier:
  replicas: 1

queryFrontend:
  replicas: 1
