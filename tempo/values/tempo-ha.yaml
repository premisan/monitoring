serviceAccount:
  create: true
  name: "tempo"
  automountServiceAccountToken: true
  annotations:
    iam.gke.io/gcp-service-account: "tempo-gcs-sa@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

multitenancyEnabled: false

ingest:
  kafka:
    address: "tempo-kafka.monitoring.svc.cluster.local:9092"
    topic: "tempo-traces"

storage:
  trace:
    backend: gcs
    gcs:
      bucket_name: "tempo-traces-<GCP_PROJECT_ID>"
    block:
      version: vParquet5

# 초당 2만건(20k spans/sec) 기준 컴포넌트 사이징
distributor:
  replicas: 4
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

blockBuilder:
  enabled: true
  replicas: 4
  persistence:
    enabled: true
    size: 50Gi
    storageClass: "premium-rwo"
  resources:
    requests:
      cpu: "1500m"
      memory: "3Gi"
    limits:
      cpu: "3000m"
      memory: "6Gi"

liveStore:
  enabled: true
  replicas: 4
  persistence:
    enabled: true
    size: 30Gi
    storageClass: "premium-rwo"
  resources:
    requests:
      cpu: "1500m"
      memory: "4Gi"
    limits:
      cpu: "3000m"
      memory: "8Gi"

backendScheduler:
  enabled: true
  replicas: 2

backendWorker:
  enabled: true
  replicas: 3
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  persistence:
    enabled: true
    size: 50Gi
    storageClass: "premium-rwo"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"

querier:
  replicas: 3
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"

queryFrontend:
  replicas: 2
