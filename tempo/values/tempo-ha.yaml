serviceAccount:
  create: true
  name: "tempo"
  annotations:
    iam.gke.io/gcp-service-account: "tempo-gcs-sa@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

# 1. Distributor Service에 OTLP gRPC(4317) 및 HTTP(4318) 포트 오픈
traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

# 2. 멀티테넌시 설정
multitenancyEnabled: false

# 3. Kafka Ingest WAL 브로커 연동 (monitoring 네임스페이스의 tempo-kafka)
ingest:
  kafka:
    address: "tempo-kafka-broker.monitoring.svc.cluster.local:9092"
    topic: "tempo-traces"

# 4. GCS 백엔드 스토리지 설정
storage:
  trace:
    backend: gcs
    gcs:
      bucket_name: "tempo-traces-<GCP_PROJECT_ID>"
    block:
      version: vParquet5

# 5. 컴포넌트별 HA 스케일아웃 구성
distributor:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"

blockBuilder:
  enabled: true
  replicas: 3
  persistence:
    enabled: true
    size: 30Gi
    storageClass: "standard-rwo"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"

liveStore:
  enabled: true
  replicas: 3
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "standard-rwo"
  resources:
    requests:
      cpu: "1000m"
      memory: "3Gi"

backendScheduler:
  enabled: true
  replicas: 2

backendWorker:
  enabled: true
  replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  persistence:
    enabled: true
    size: 30Gi
    storageClass: "standard-rwo"

querier:
  replicas: 3
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"

queryFrontend:
  replicas: 2
