serviceAccount:
  create: true
  name: "tempo"
  automountServiceAccountToken: true
  annotations:
    iam.gke.io/gcp-service-account: "tempo-gcs-sa@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

multitenancyEnabled: false

ingest:
  kafka:
    address: "tempo-kafka.monitoring.svc.cluster.local:9092"
    topic: "tempo-traces"
    auto_create_topic_enabled: true
    auto_create_topic_default_partitions: 6

storage:
  trace:
    backend: gcs
    gcs:
      bucket_name: "tempo-traces-<GCP_PROJECT_ID>"
    block:
      version: vParquet5

distributor:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

blockBuilder:
  enabled: true
  replicas: 6 # Kafka 토픽 파티션 수(6개)와 1:1 매핑
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

liveStore:
  enabled: true
  replicas: 6 # Kafka 토픽 파티션 수(6개)와 1:1 매핑 (최근 트레이스 100% 서빙)
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "premium-rwo" # GKE SSD 권장 (또는 standard-rwo)
  resources:
    requests:
      cpu: "1000m"
      memory: "3Gi"
    limits:
      cpu: "2000m"
      memory: "5Gi"

backendScheduler:
  enabled: true
  replicas: 1
  config:
    provider:
      compaction:
        compaction:
          block_retention: 168h # 7일 보존

backendWorker:
  enabled: true
  replicas: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"

querier:
  replicas: 1
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"

queryFrontend:
  replicas: 1
