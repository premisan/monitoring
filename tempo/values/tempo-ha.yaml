serviceAccount:
  create: true
  name: "tempo"
  automountServiceAccountToken: true
  annotations:
    iam.gke.io/gcp-service-account: "tempo-gcs-sa@<GCP_PROJECT_ID>.iam.gserviceaccount.com"

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

multitenancyEnabled: false

ingest:
  kafka:
    address: "tempo-kafka.monitoring.svc.cluster.local:9092"
    topic: "tempo-traces"

storage:
  trace:
    backend: gcs
    gcs:
      bucket_name: "tempo-traces-<GCP_PROJECT_ID>"
    block:
      version: vParquet5

distributor:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"

blockBuilder:
  enabled: true
  replicas: 3
  persistence:
    enabled: true
    size: 30Gi
    storageClass: "premium-rwo"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"

liveStore:
  enabled: true
  replicas: 3
  persistence:
    enabled: true
    size: 20Gi
    storageClass: "premium-rwo"
  resources:
    requests:
      cpu: "1000m"
      memory: "3Gi"

backendScheduler:
  enabled: true
  replicas: 2

backendWorker:
  enabled: true
  replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  persistence:
    enabled: true
    size: 30Gi
    storageClass: "premium-rwo"

querier:
  replicas: 3
  resources:
    requests:
      cpu: "1000m"
      memory: "1Gi"

queryFrontend:
  replicas: 2
